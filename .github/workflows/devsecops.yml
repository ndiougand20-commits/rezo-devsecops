name: DevSecOps

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

env:
  IMAGE_NAME: rezo-backend

jobs:
  secrets:
    name: Secrets / Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan complete history
        id: gitleaks
        continue-on-error: true
        uses: docker://zricethezav/gitleaks:v8.30.0
        with:
          args: git --redact --report-format sarif --report-path gitleaks.sarif --exit-code 1

      - name: Upload Gitleaks SARIF
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

      - name: Enforce secret gate
        if: steps.gitleaks.outcome == 'failure'
        run: exit 1

  sast:
    name: SAST / Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.174.0
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Run custom and OWASP rules
        id: semgrep
        continue-on-error: true
        run: >-
          semgrep scan
          --config .semgrep/rules.yaml
          --config p/owasp-top-ten
          --config p/nodejs
          --sarif
          --output semgrep.sarif
          --error
          backend/src rezo/lib

      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Enforce SAST gate
        if: steps.semgrep.outcome == 'failure'
        run: exit 1

  sca:
    name: SCA / Snyk and Trivy FS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Run Snyk Maven scan
        id: snyk
        continue-on-error: true
        uses: snyk/actions/maven@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --file=backend/pom.xml --severity-threshold=high --sarif-file-output=snyk.sarif

      - name: Upload Snyk SARIF
        if: always() && hashFiles('snyk.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk.sarif
          category: snyk

      - name: Run Trivy filesystem scan
        id: trivy_fs
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload Trivy FS SARIF
        if: always() && hashFiles('trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Enforce dependency gate
        if: steps.snyk.outcome == 'failure' || steps.trivy_fs.outcome == 'failure'
        run: exit 1

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [sast, sca]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build image tagged with commit SHA
        run: docker build --tag "${IMAGE_NAME}:${GITHUB_SHA}" .

      - name: Export image
        run: docker save --output rezo-image.tar "${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: rezo-image-${{ github.sha }}
          path: rezo-image.tar
          retention-days: 1

  image_scan:
    name: Container / Trivy image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: rezo-image-${{ github.sha }}

      - name: Load image
        run: docker load --input rezo-image.tar

      - name: Scan image
        id: trivy_image
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload image SARIF
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Enforce image gate
        if: steps.trivy_image.outcome == 'failure'
        run: exit 1

  summary:
    name: Security summary
    runs-on: ubuntu-latest
    if: always()
    needs: [secrets, sast, sca, build, image_scan]
    steps:
      - name: Publish job summary
        env:
          SECRETS_RESULT: ${{ needs.secrets.result }}
          SAST_RESULT: ${{ needs.sast.result }}
          SCA_RESULT: ${{ needs.sca.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          IMAGE_RESULT: ${{ needs.image_scan.result }}
        run: |
          {
            echo '## Résumé DevSecOps'
            echo '| Contrôle | Résultat |'
            echo '|---|---|'
            echo "| GitLeaks | ${SECRETS_RESULT} |"
            echo "| Semgrep custom + OWASP | ${SAST_RESULT} |"
            echo "| Snyk + Trivy FS | ${SCA_RESULT} |"
            echo "| Build Docker SHA | ${BUILD_RESULT} |"
            echo "| Trivy image | ${IMAGE_RESULT} |"
          } >> "$GITHUB_STEP_SUMMARY"
