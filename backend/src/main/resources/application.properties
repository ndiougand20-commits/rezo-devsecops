spring.application.name=backend
spring.config.import=optional:file:.env[.properties]

# PostgreSQL datasource
spring.datasource.url=${REZO_DB_URL:jdbc:postgresql://localhost:5432/rezo_db}
spring.datasource.username=${REZO_DB_USERNAME:rezo_user}
spring.datasource.password=${REZO_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${REZO_SHOW_SQL:false}
spring.jpa.open-in-view=false

# OpenAPI / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.api-docs.enabled=${REZO_OPENAPI_ENABLED:false}
springdoc.swagger-ui.enabled=${REZO_OPENAPI_ENABLED:false}

# JWT
rezo.jwt.secret=${REZO_JWT_SECRET}
rezo.jwt.expiration-ms=${REZO_JWT_EXPIRATION_MS:900000}
rezo.jwt.refresh-expiration-ms=${REZO_REFRESH_EXPIRATION_MS:604800000}

# CORS: comma-separated HTTPS origins in production.
rezo.security.allowed-origins=${REZO_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
rezo.matching.synthetic-seed.enabled=${REZO_SYNTHETIC_MATCHING_SEED:false}

# Media uploads (profile photos and justificatif PDFs)
rezo.media.upload-dir=uploads
